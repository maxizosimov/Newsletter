<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0; --paper: #fffdf9; --raised: #efece5; --ink: #191814; --ink-2: #3d3a34;
  --muted: #77736b; --faint: #aba69d; --line: #e6e1d7; --line-2: #d7d1c5;
  --accent: #d4480f; --open: #0f8a6a; --claimed: #a15c07; --rumor: #b4234a;
  --shadow: 0 1px 2px rgba(20,18,14,.05), 0 10px 30px rgba(20,18,14,.06);
  --society: #7c5cc4; --business: #b7791f; --apps: #0f8a7e; --models: #d4480f;
  --infra: #2f6fd0; --chips: #3f8f3a; --energy: #c23a3a;
  --glow: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f0d; --paper: #181815; --raised: #22211e; --ink: #f0ede7; --ink-2: #d2cec6;
    --muted: #9d988f; --faint: #67635b; --line: #262522; --line-2: #36342f;
    --accent: #ff7a3d; --open: #3cc79f; --claimed: #e9b44c; --rumor: #ff7a9a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --society: #a98bf0; --business: #e2a845; --apps: #3cc4b4; --models: #ff7a3d;
    --infra: #6aa4ff; --chips: #6fc466; --energy: #ff6b6b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: none; }
.serif { font-family: Newsreader, Georgia, serif; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--c, var(--muted)); letter-spacing: .02em; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--faint)); }
.badge { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.badge.claimed { color: var(--claimed); } .badge.rumor { color: var(--rumor); }
.rise { color: var(--accent); font-weight: 600; }

/* Ambient light: each room is tinted by where it sits in the stack, and deeper rooms get dimmer. */
.ambient { position: fixed; inset: -20vh -20vw auto; height: 90vh; pointer-events: none; z-index: 0;
  background: radial-gradient(60% 55% at 50% 0%, color-mix(in srgb, var(--glow) calc(var(--glow-k, 14) * 1%), transparent), transparent 70%);
  transition: background 600ms ease; }

/* ---------- Top bar ---------- */
.bar { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.bar-in { max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 18px; }
.mark { font: 600 21px/1 Newsreader, Georgia, serif; letter-spacing: -0.01em; }
.nav { display: flex; gap: 2px; margin-left: auto; }
.nav a { padding: 6px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }
.upd { font-size: 12px; color: var(--faint); white-space: nowrap; }

/* ---------- The room ---------- */
main { position: relative; z-index: 1; }
.room { max-width: 760px; margin: 0 auto; padding: 44px 24px 90px; transform-origin: 50% 30vh; }
.room.out-in { animation: outIn 220ms cubic-bezier(.4,0,1,1) forwards; }
.room.in-in { animation: inIn 420ms cubic-bezier(.15,.85,.25,1) both; }
.room.out-up { animation: outUp 200ms cubic-bezier(.4,0,1,1) forwards; }
.room.in-up { animation: inUp 380ms cubic-bezier(.15,.85,.25,1) both; }
@keyframes outIn { to { opacity: 0; transform: scale(1.08); filter: blur(6px); } }
@keyframes inIn { from { opacity: 0; transform: scale(.94); filter: blur(8px); } }
@keyframes outUp { to { opacity: 0; transform: scale(.94); filter: blur(6px); } }
@keyframes inUp { from { opacity: 0; transform: scale(1.06); filter: blur(8px); } }

/* Trail back to where you came from */
.trail { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 12.5px; color: var(--faint); margin-bottom: 26px; min-height: 19px; }
.trail a { color: var(--muted); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; }
.trail a:hover { color: var(--ink); }
.trail .sep { opacity: .6; }
.trail .here { color: var(--ink-2); font-weight: 500; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.depth { margin-left: auto; display: inline-flex; gap: 3px; align-items: center; }
.depth i { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.depth i.on { background: var(--glow); }

/* Room header */
.hello { font: 500 clamp(34px, 5.4vw, 50px)/1.05 Newsreader, Georgia, serif; letter-spacing: -0.02em; margin: 10px 0 6px; }
.hello em { font-style: italic; color: var(--muted); }
.room-sub { color: var(--muted); font-size: 14px; margin: 0; }
.story-k { font: 600 clamp(36px, 6vw, 58px)/1.03 Newsreader, Georgia, serif; letter-spacing: -0.022em; margin: 14px 0 0; text-wrap: balance; }
.story-h { color: var(--muted); font-size: 14px; margin: 12px 0 0; }
.story-why { font: 400 italic 22px/1.45 Newsreader, Georgia, serif; color: var(--ink-2); margin: 18px 0 0; text-wrap: pretty; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 22px; font-size: 13px; color: var(--muted); }
.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.spark i { width: 4px; border-radius: 1px; background: var(--line-2); }
.spark i.now { background: var(--accent); }
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 12px; border: 1px solid var(--line-2); font-size: 14px; transition: border-color .15s, background .15s; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.btn small { color: var(--faint); font-size: 12px; }
.btn.primary small { color: inherit; opacity: .6; }
details.more { margin-top: 26px; border-top: 1px solid var(--line); }
details.more + details.more { margin-top: 0; }
details.more summary { cursor: pointer; list-style: none; padding: 13px 0; font-size: 13.5px; color: var(--muted); display: flex; justify-content: space-between; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; font-size: 16px; line-height: 1; }
details.more[open] summary::after { content: "–"; }
details.more summary:hover { color: var(--ink); }
.angle { display: block; padding: 10px 0 12px; border-top: 1px solid var(--line); }
.angle b { display: block; font: 600 17px/1.25 Newsreader, Georgia, serif; }
.angle p { margin: 3px 0 4px; font-size: 13.5px; color: var(--ink-2); }
.angle span { font-size: 12px; color: var(--muted); }
.angle:hover b { text-decoration: underline; text-decoration-color: var(--faint); }
.cov { list-style: none; margin: 0 0 10px; padding: 0; font-size: 13px; }
.cov li { display: grid; grid-template-columns: 130px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.cov .p { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cov a:hover { text-decoration: underline; }

/* ---------- Portals ---------- */
.deeper { margin-top: 54px; }
.deeper-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.deeper-h h2 { margin: 0; font: 500 italic 24px/1.1 Newsreader, Georgia, serif; color: var(--ink-2); }
.deeper-h span { font-size: 12px; color: var(--faint); }
.more-stories { display: flex; justify-content: center; gap: 8px; align-items: baseline; width: 100%; padding: 18px 0; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.more-stories:hover { color: var(--ink); }
.more-stories small { font-size: 12px; color: var(--faint); }
.stream-end { text-align: center; padding: 18px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--faint); margin: 0; }
.portals { list-style: none; margin: 0; padding: 0; counter-reset: p; }
.portal { position: relative; display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 16px; align-items: baseline; width: 100%;
  padding: 20px 0 20px; border-top: 1px solid var(--line); counter-increment: p; transition: padding .2s ease; }
.portals li:first-child .portal { border-top-color: var(--line-2); }
.portal::before { content: counter(p); font: 500 14px/1 Newsreader, Georgia, serif; color: var(--faint); align-self: start; padding-top: .55em; font-variant-numeric: tabular-nums; }
.portal::after { content: ""; position: absolute; left: -18px; top: 22px; bottom: 22px; width: 3px; border-radius: 2px; background: var(--c); opacity: 0; transform: scaleY(.3); transition: opacity .2s, transform .25s; }
.portal:hover::after, .portal:focus-visible::after { opacity: 1; transform: none; }
.portal:hover { padding-left: 6px; }
.portal:focus-visible { outline: none; }
.p-body { min-width: 0; }
.p-why-tag { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--c); margin-bottom: 4px; }
.p-k { display: block; font: 600 26px/1.15 Newsreader, Georgia, serif; letter-spacing: -0.012em; text-wrap: balance; }
.p-s { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; font-size: 14px; color: var(--muted); text-wrap: pretty; }
.p-side { text-align: right; font-size: 12px; color: var(--faint); white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: .35em; }
.p-side .go { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--muted); font-size: 15px; transition: background .2s, color .2s, border-color .2s, transform .25s; }
.portal:hover .go { background: var(--ink); border-color: var(--ink); color: var(--bg); transform: scale(1.08); }
.size { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.portal.seen .p-k { color: var(--muted); }
.portal.seen .p-side .seen-l { display: inline; }
.seen-l { display: none; font-size: 11px; }
.lead .p-k { font-size: clamp(32px, 4.6vw, 42px); line-height: 1.05; }
.lead .p-s { -webkit-line-clamp: 3; font-size: 15.5px; color: var(--ink-2); }

/* Fields: other ways in from the front page */
.fields { margin-top: 54px; }
.fields .eyebrow { margin-bottom: 12px; display: block; }
.fields-list { display: flex; flex-wrap: wrap; gap: 8px; }
.field { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 12px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 13.5px; transition: border-color .15s, background .15s; }
.field::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.field:hover { border-color: var(--c); background: color-mix(in srgb, var(--c) 7%, transparent); }
.field small { color: var(--faint); font-size: 12px; }
.foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--faint); display: grid; gap: 6px; }
.keys { font-size: 12px; color: var(--faint); }
.keys kbd { font: 500 11px/1 Inter, sans-serif; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--muted); }

/* ---------- Models: one block per lab, newest release first ---------- */
.models-wrap { max-width: 760px; margin: 0 auto; padding: 44px 24px 90px; }
.newsum { margin-top: 22px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: color-mix(in srgb, var(--open) 12%, transparent); color: var(--open); font-size: 13.5px; font-weight: 600; }
.newsum::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--open); }
.lab { margin-top: 40px; }
.lab-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
.lab-h h2 { margin: 0; font: 600 26px/1.1 Newsreader, Georgia, serif; letter-spacing: -0.01em; }
.lab-h .kind { font-size: 12px; color: var(--muted); }
.lab-h .latest { margin-left: auto; font-size: 12.5px; color: var(--faint); white-space: nowrap; }
.rel { display: grid; grid-template-columns: 62px 1fr auto; gap: 2px 16px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); transition: padding .2s; }
.rel:hover { padding-left: 6px; }
.rel .when { font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.rel .name { font: 600 21px/1.2 Newsreader, Georgia, serif; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rel:first-of-type .name { font-size: 25px; }
.rel .hl { display: block; font-size: 13.5px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel .side { font-size: 12px; color: var(--faint); white-space: nowrap; text-align: right; }
.rel.older { display: none; } .lab.all .rel.older { display: grid; }
.ow { font: 600 10.5px/1 Inter, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--open); border: 1px solid color-mix(in srgb, var(--open) 40%, transparent); border-radius: 4px; padding: 3px 5px; }
.newtag { font: 700 10.5px/1 Inter, sans-serif; letter-spacing: .08em; color: #fff; background: var(--open); border-radius: 4px; padding: 4px 6px; }
@media (prefers-color-scheme: dark) { .newtag { color: #08130f; } }
.morebtn { padding: 10px 0; font-size: 13px; color: var(--muted); }
.morebtn:hover { color: var(--ink); }
.quietlab { margin-top: 40px; font-size: 13px; color: var(--faint); }
.cc { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; background: var(--raised); color: var(--muted); }
.cc.CN { background: color-mix(in srgb, #d23 14%, var(--paper)); color: #c0262d; }
@media (prefers-color-scheme: dark) { .cc.CN { color: #ff8a8a; } }
details.hf { margin-top: 56px; border-top: 1px solid var(--line-2); }
details.hf summary { cursor: pointer; list-style: none; padding: 16px 0; display: flex; justify-content: space-between; align-items: baseline; }
details.hf summary::-webkit-details-marker { display: none; }
details.hf summary b { font: 500 italic 22px/1.1 Newsreader, Georgia, serif; color: var(--ink-2); }
details.hf summary span { font-size: 12.5px; color: var(--faint); }
.hfrow { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hfrow .r { font: 500 15px/1 Newsreader, Georgia, serif; color: var(--faint); }
.hfrow .n { font-weight: 600; }
.hfrow small { color: var(--muted); margin-left: 6px; }
.hfrow .side { font-size: 12px; color: var(--faint); }
.nav .count { display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--open); color: #fff; font-size: 10.5px; font-weight: 700; vertical-align: 1px; }
.view[hidden] { display: none; }

@media (max-width: 560px) {
  .bar-in, .room, .models-wrap { padding-left: 16px; padding-right: 16px; }
  .room { padding-top: 28px; }
  .upd, .keys { display: none; }
  .portal { grid-template-columns: 24px 1fr; }
  .p-side { display: none; }
  .p-k { font-size: 22px; }
  .story-why { font-size: 19px; }
  .cov li { grid-template-columns: 1fr; gap: 0; }
  .rel { grid-template-columns: 52px 1fr; }
  .rel .side, .lab-h .latest { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>
<header class="bar"><div class="bar-in">
  <a class="mark" href="#/">AI Brief</a>
  <nav class="nav"><a href="#/" id="nav-news">News</a><a href="#models" id="nav-models">Models</a></nav>
  <span class="upd" id="updated"></span>
</div></header>

<main>
  <div class="view" id="view-news"><div class="room" id="room"></div></div>
  <div class="view" id="view-models" hidden><div class="models-wrap" id="models-room"></div></div>
</main>

<script id="data" type="application/json">{{ data | tojson }}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const S = D.storylines, M = D.models;
  const LAYER = Object.fromEntries(D.layers.map(l => [l.key, l]));
  const byId = Object.fromEntries(S.map(s => [String(s.id), s]));
  const generated = new Date(D.generated);
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const toDate = t => new Date(t.length <= 16 ? t + ":00Z" : t);
  const ago = t => {
    const h = Math.max(0, (Date.now() - toDate(t)) / 36e5);
    if (h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
    if (h < 24) return Math.round(h) + "h ago";
    const d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
  };
  const color = layer => `var(--${layer})`;
  const tag = s => `<span class="tag" style="--c:${color(s.layer)}">${esc(LAYER[s.layer]?.name || s.layer)}</span>`;
  const badge = s => s.status !== "confirmed" ? `<span class="badge ${s.status}">${s.status}</span>` : "";
  const outlets = n => `${n} outlet${n === 1 ? "" : "s"}`;
  const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n ?? 0);
  // How big a story is, in words, from how many independent outlets carry it.
  const sizeWord = s => s.outlets >= 25 ? "Huge" : s.outlets >= 12 ? "Big" : s.outlets >= 6 ? "Notable" : "";
  const FRONT = 7;

  $("updated").textContent = "Updated " + generated.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});

  // Stories you've already stepped into are marked, so going deeper keeps showing you something new.
  const seen = new Set();
  try { JSON.parse(sessionStorage.getItem("seen") || "[]").forEach(i => seen.add(String(i))); } catch {}
  const remember = id => { seen.add(String(id)); try { sessionStorage.setItem("seen", JSON.stringify([...seen])); } catch {} };

  // ---------- Where you are: a path of rooms, kept in the address bar ----------
  // "#/" is the front page, "#/L:chips" a field, "#/L:chips/12/-40" stories reached from there.
  const parse = () => {
    const h = location.hash;
    if (h.startsWith("#models")) return { view: "models", path: [] };
    return { view: "news", path: h.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent) };
  };
  const href = path => "#/" + path.map(encodeURIComponent).join("/");
  const label = seg => seg.startsWith("L:") ? (LAYER[seg.slice(2)]?.name || seg.slice(2)) : (byId[seg]?.kicker || "Story");

  function trail(path) {
    const crumbs = [`<a href="#/">Today</a>`];
    path.slice(0, -1).forEach((seg, i) => crumbs.push(`<a href="${href(path.slice(0, i + 1))}">${esc(label(seg))}</a>`));
    if (path.length) crumbs.push(`<span class="here">${esc(label(path.at(-1)))}</span>`);
    const dots = Array.from({ length: Math.max(4, path.length + 1) }, (_, i) => `<i class="${i <= path.length ? "on" : ""}"></i>`).join("");
    return `<nav class="trail" aria-label="Trail">${crumbs.join('<span class="sep">›</span>')}<span class="depth" title="Depth ${path.length}">${dots}</span></nav>`;
  }

  // One doorway into another story.
  function portal(s, path, opts = {}) {
    const why = opts.why ? `<span class="p-why-tag">${esc(opts.why)}</span>` : "";
    const size = sizeWord(s) ? `<span class="size">${sizeWord(s)}</span>` : "";
    return `<li><a class="portal ${opts.lead ? "lead" : ""} ${seen.has(String(s.id)) ? "seen" : ""}" href="${href([...path, String(s.id)])}" style="--c:${color(s.layer)}">
      <span class="p-body">${why}<span class="p-k">${esc(s.kicker)}</span><span class="p-s">${esc(s.why)}</span></span>
      <span class="p-side">${size}<span>${outlets(s.outlets)}${s.rising ? ` · <span class="rise">+${s.rising}</span>` : ""}</span><span class="seen-l">seen</span><span class="go" aria-hidden="true">→</span></span>
    </a></li>`;
  }
  const portals = (list, path, whyOf, lead) => `<ol class="portals">${list.map((s, i) => portal(s, path, { why: whyOf?.(s), lead: lead && i === 0 })).join("")}</ol>`;

  // An endless list: the first few doors, then more as you scroll, until every story is reachable.
  // Each room hands over its queue ({s, why}); the page keeps one stream for the room on screen.
  const STEP = 6;
  let stream = null;
  const unseenFirst = list => [...list].sort((a, b) => seen.has(String(a.s.id)) - seen.has(String(b.s.id)));
  function endless(queue, path, first, lead) {
    stream = { queue, path, shown: Math.min(first, queue.length) };
    return `<ol class="portals" id="stream">${queue.slice(0, stream.shown).map((q, i) => portal(q.s, path, { why: q.why, lead: lead && i === 0 })).join("")}</ol>${moreButton()}`;
  }
  const moreButton = () => stream.shown < stream.queue.length
    ? `<button class="more-stories" id="more-stories">More stories <small>${stream.queue.length - stream.shown} left</small></button>` : "";
  function more() {
    if (!stream || stream.shown >= stream.queue.length) return;
    const next = stream.queue.slice(stream.shown, stream.shown + STEP);
    stream.shown += next.length;
    $("stream").insertAdjacentHTML("beforeend", next.map(q => portal(q.s, stream.path, { why: q.why })).join(""));
    $("more-stories").outerHTML = moreButton() || `<p class="stream-end">That's everything from the last ${D.window_hours / 24} days.</p>`;
    watchMore();
  }
  // Scrolling near the end loads the next few; the button works too.
  const moreObserver = "IntersectionObserver" in window ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, { rootMargin: "300px" }) : null;
  function watchMore() { moreObserver?.disconnect(); const b = $("more-stories"); if (b && moreObserver) moreObserver.observe(b); }
  document.addEventListener("click", e => { if (e.target.closest("#more-stories")) more(); });

  // ---------- Rooms ----------
  function frontRoom() {
    const hr = generated.getHours();
    const part = hr < 12 ? "morning" : hr < 18 ? "afternoon" : "evening";
    const top = S.slice(0, FRONT);
    const fields = D.layers.map(l => ({ ...l, n: S.filter(s => s.layer === l.key).length })).filter(l => l.n);
    return {
      glow: top[0] ? top[0].layer : "models",
      html: `${trail([])}
        <div class="eyebrow">${generated.toLocaleDateString([], {weekday: "long", month: "long", day: "numeric"})}</div>
        <h1 class="hello">${["One", "Two", "Three", "Four", "Five", "Six", "Seven"][top.length - 1] || top.length} things this ${part}. <em>Step into any of them.</em></h1>
        <p class="room-sub">${S.length} storylines from ${D.sources.outlets} outlets${D.filtered ? `, ${D.filtered} more skipped as noise` : ""}.</p>
        <section class="deeper" style="margin-top:34px">${endless(S.map(s => ({ s })), [], FRONT, true)}</section>
        <section class="fields"><span class="eyebrow">Or enter through a part of the stack</span>
          <div class="fields-list">${fields.map(l => `<a class="field" href="${href(["L:" + l.key])}" style="--c:${color(l.key)}">${esc(l.name)}<small>${l.n}</small></a>`).join("")}</div>
        </section>
        <div class="foot"><span>Reading ${D.sources.active} sources, found automatically and graded for speed and depth. Summaries are written by a local open model.</span>
          <span class="keys"><kbd>1</kbd>–<kbd>7</kbd> step in · <kbd>Esc</kbd> step back</span></div>`,
    };
  }

  function fieldRoom(key, path) {
    const l = LAYER[key];
    const list = S.filter(s => s.layer === key);
    const others = D.layers.filter(o => o.key !== key && S.some(s => s.layer === o.key));
    return {
      glow: key,
      html: `${trail(path)}
        <div class="eyebrow" style="color:${color(key)}">Part of the stack</div>
        <h1 class="hello">${esc(l?.name || key)}</h1>
        <p class="room-sub">${esc(l?.hint || "")}</p>
        <section class="deeper" style="margin-top:34px">${endless(list.map(s => ({ s })), path, 8, true)}</section>
        <section class="fields"><span class="eyebrow">Next door</span>
          <div class="fields-list">${others.map(o => `<a class="field" href="${href(["L:" + o.key])}" style="--c:${color(o.key)}">${esc(o.name)}</a>`).join("")}</div>
        </section>`,
    };
  }

  function storyRoom(s, path) {
    remember(s.id);
    const onPath = new Set(path);
    const doors = s.doors.filter(d => !onPath.has(String(d.id)) && byId[d.id]);
    // Unvisited doors first, so every step offers something new; visited ones stay reachable.
    doors.sort((a, b) => seen.has(String(a.id)) - seen.has(String(b.id)));
    // The closest stories first; after them the rest of today, same part of the stack first, so
    // there is always somewhere else to go.
    const taken = new Set([String(s.id), ...path, ...doors.map(d => String(d.id))]);
    const rest = S.filter(o => !taken.has(String(o.id)));
    const queue = [
      ...doors.map(d => ({ s: byId[d.id], why: d.why })),
      ...unseenFirst(rest.filter(o => o.layer === s.layer).map(o => ({ s: o, why: `More in ${LAYER[o.layer]?.name || o.layer}` }))),
      ...unseenFirst(rest.filter(o => o.layer !== s.layer).map(o => ({ s: o, why: "Also today" }))),
    ];
    const max = Math.max(1, ...s.momentum);
    const spark = `<span class="spark" title="Outlets joining, ${D.bucket_hours}h slots">${s.momentum.map((v, i) => `<i class="${i >= s.momentum.length - 2 ? "now" : ""}" style="height:${Math.max(1, v / max * 16)}px"></i>`).join("")}</span>`;
    return {
      glow: s.layer,
      html: `${trail(path)}
        <div class="meta">${tag(s)}${badge(s)}${s.lenses.map(l => `<span class="tag">AI × ${esc(l)}</span>`).join("")}</div>
        <h1 class="story-k">${esc(s.kicker)}</h1>
        ${s.headline && s.headline !== s.kicker ? `<p class="story-h">${esc(s.headline)}</p>` : ""}
        <p class="story-why">${esc(s.why)}</p>
        <div class="facts">${spark}<span>${outlets(s.outlets)}</span>${s.rising ? `<span class="rise">+${s.rising} in the last 12h</span>` : `<span>last update ${ago(s.last_seen)}</span>`}${sizeWord(s) ? `<span class="size">${sizeWord(s)}</span>` : ""}</div>
        <div class="acts">
          <a class="btn primary" href="${esc(s.best.url)}" target="_blank" rel="noopener">Read at ${esc(s.best.publisher)} <small>best source</small></a>
          ${s.broke.url !== s.best.url ? `<a class="btn" href="${esc(s.broke.url)}" target="_blank" rel="noopener">${esc(s.broke.publisher)} <small>broke it ${ago(s.broke.time)}</small></a>` : ""}
        </div>
        ${s.angles.length > 1 ? `<details class="more"><summary>${s.angles.length} angles on this</summary>${s.angles.map(a => `
          <a class="angle" href="${esc(a.best.url)}" target="_blank" rel="noopener"><b>${esc(a.kicker)}</b><p>${esc(a.summary)}</p><span>${outlets(a.outlets)} · read at ${esc(a.best.publisher)}</span></a>`).join("")}</details>` : ""}
        <details class="more"><summary>All coverage (${s.coverage.length})</summary><ul class="cov">${s.coverage.map(c => `<li><span class="p">${esc(c.publisher)}</span><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a></li>`).join("")}</ul></details>
        ${queue.length ? `<section class="deeper"><div class="deeper-h"><h2>Go deeper</h2><span>${doors.length} closely connected</span></div>
          ${endless(queue, path, Math.max(5, Math.min(doors.length, 8)), false)}</section>` : ""}
        <div class="foot"><span class="keys"><kbd>1</kbd>–<kbd>9</kbd> go deeper · <kbd>Esc</kbd> step back</span></div>`,
    };
  }

  function roomFor(path) {
    if (!path.length) return frontRoom();
    const last = path.at(-1);
    if (last.startsWith("L:")) return fieldRoom(last.slice(2), path);
    const s = byId[last];
    return s ? storyRoom(s, path) : frontRoom();
  }

  // ---------- Moving between rooms ----------
  const room = $("room");
  let current = null, busy = null;
  function go(state) {
    const prevDepth = current ? current.path.length : 0;
    $("view-news").hidden = state.view !== "news"; $("view-models").hidden = state.view !== "models";
    for (const v of ["news", "models"]) {
      if (state.view === v) $("nav-" + v).setAttribute("aria-current", "page"); else $("nav-" + v).removeAttribute("aria-current");
    }
    const first = !current || current.view !== "news" || state.view !== "news";
    current = state;
    if (state.view !== "news") {
      renderModels();
      document.documentElement.style.setProperty("--glow", "var(--open)");
      $("ambient").style.setProperty("--glow-k", "10");
      window.scrollTo({ top: 0 });
      return;
    }
    const r = roomFor(state.path);
    const paint = () => {
      room.className = "room";
      room.innerHTML = r.html;
      document.documentElement.style.setProperty("--glow", color(r.glow));
      // The deeper you go the stronger the room's own colour.
      $("ambient").style.setProperty("--glow-k", String(Math.min(30, 12 + state.path.length * 5)));
      window.scrollTo({ top: 0 });
      void room.offsetWidth;
      room.classList.add(state.path.length >= prevDepth ? "in-in" : "in-up");
      room.querySelector("h1")?.focus?.({ preventScroll: true });
      watchMore();
    };
    clearTimeout(busy);
    if (first || matchMedia("(prefers-reduced-motion: reduce)").matches) return paint();
    room.className = "room " + (state.path.length >= prevDepth ? "out-in" : "out-up");
    busy = setTimeout(paint, 190);
  }
  window.addEventListener("hashchange", () => go(parse()));

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey || current?.view !== "news") return;
    if (e.key === "Escape" || (e.key === "Backspace" && !/input|textarea/i.test(e.target.tagName))) {
      if (!current.path.length) return;
      e.preventDefault();
      location.hash = href(current.path.slice(0, -1));
    } else if (/^[1-9]$/.test(e.key)) {
      const links = room.querySelectorAll(".portal");
      const a = links[Number(e.key) - 1]; if (a) location.hash = a.getAttribute("href");
    }
  });

  // ---------- Models: every tracked lab, its releases newest first ----------
  // A release stays marked NEW until you've opened this page once after it appeared. On a first
  // visit, only the last seven days count as new.
  const cc = c => c ? `<span class="cc ${c}">${c}</span>` : "";
  const day = t => toDate(t).toLocaleDateString([], {month: "short", day: "numeric"});
  const allReleases = M.labs.flatMap(l => l.releases);
  let seenModels = null;
  try { const raw = localStorage.getItem("seenModels"); if (raw) seenModels = new Set(JSON.parse(raw)); } catch {}
  const isNew = m => seenModels ? !seenModels.has(m.key) : (Date.now() - toDate(m.date)) < 7 * 864e5;
  const fresh = allReleases.filter(isNew);
  if (fresh.length) $("nav-models").insertAdjacentHTML("beforeend", `<span class="count" id="models-count">${fresh.length}</span>`);

  function renderModels() {
    const shown = new Set(fresh.map(m => m.key));
    const active = M.labs.filter(l => l.releases.length), quiet = M.labs.filter(l => !l.releases.length);
    const rel = (m, i) => `<a class="rel ${i >= 3 ? "older" : ""}" href="${esc(m.url)}" target="_blank" rel="noopener">
        <span class="when">${day(m.date)}</span>
        <span style="min-width:0"><span class="name">${esc(m.model)}${shown.has(m.key) ? `<span class="newtag">NEW</span>` : ""}${m.open ? `<span class="ow">open weights</span>` : ""}</span>
          <span class="hl">${esc(m.headline)}</span></span>
        <span class="side">${esc(m.source)}${m.outlets > 1 ? ` · ${outlets(m.outlets)}` : ""}</span></a>`;
    $("models-room").innerHTML = `
      <div class="eyebrow">Model releases</div>
      <h1 class="hello">What the labs shipped</h1>
      <p class="room-sub">Every lab we track, newest release first. Found in launch coverage from the last ${M.search_days} days and kept from then on.</p>
      ${fresh.length ? `<div class="newsum">${fresh.length} new since your last visit: ${fresh.slice(0, 3).map(m => esc(m.model)).join(", ")}${fresh.length > 3 ? "…" : ""}</div>` : ""}
      ${active.map(l => `<section class="lab">
        <div class="lab-h"><h2>${esc(l.lab)}</h2>${cc(l.country)}<span class="kind">${l.open ? "open weights" : ""}</span><span class="latest">latest ${ago(l.releases[0].date)}</span></div>
        ${l.releases.map(rel).join("")}
        ${l.releases.length > 3 ? `<button class="morebtn" data-more>+ ${l.releases.length - 3} earlier</button>` : ""}
      </section>`).join("")}
      ${quiet.length ? `<p class="quietlab">No releases found yet for ${quiet.map(l => esc(l.lab)).join(", ")}.</p>` : ""}
      <details class="hf"><summary><b>Trending on Hugging Face</b><span>${M.trending.length} models developers are downloading now</span></summary>
        ${M.trending.map(t => `<a class="hfrow" href="https://huggingface.co/${esc(t.id)}" target="_blank" rel="noopener">
          <span class="r">${t.rank}</span><span><span class="n">${esc(t.name)}</span><small>${esc(t.org)}</small> ${cc(t.country)}</span><span class="side">♥ ${fmt(t.likes)}</span></a>`).join("")}
      </details>`;
    // Opening this page counts as having seen everything on it; the NEW marks stay until you leave.
    try { localStorage.setItem("seenModels", JSON.stringify(allReleases.map(m => m.key))); } catch {}
    $("models-count")?.remove();
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-more]"); if (!b) return;
    b.closest(".lab").classList.add("all"); b.remove();
  });

  go(parse());
})();
</script>
</body>
</html>
